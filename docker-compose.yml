version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: system-design-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-events_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: system-design-api
    depends_on:
      database:
        condition: service_healthy
    environment:
      PORT: 5000
      DB_HOST: database
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-events_db}
      DB_PORT: 5432
    ports:
      - "5000:5000"

volumes:
  postgres_data:
